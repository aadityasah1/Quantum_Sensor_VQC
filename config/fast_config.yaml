# Fast config for CPU testing — reduced problem size (~10x faster than base_config)
# Use: python train.py --config config/fast_config.yaml --no-noise

experiment:
  name: "vqc_sensor_fast"
  seeds: [42]
  n_folds: 3

data:
  n_samples: 300
  n_features: 6
  n_classes: 2
  signal_snr: 3.0
  test_split: 0.20
  val_split: 0.15

vqc:
  n_qubits: 6
  feature_map: "zz"
  ansatz: "hardware_efficient"
  reps: 2
  init_strategy: "near_identity"
  optimizer: "spsa"
  max_iter: 150
  shots: 512

noise:
  profile: "medium"
  depolarizing_1q: 0.001
  depolarizing_2q: 0.01
  t1_us: 100
  t2_us: 80
  readout_error: 0.02
  gate_time_1q_ns: 50
  gate_time_2q_ns: 300

mitigation:
  zne_enabled: false
  zne_scale_factors: [1, 3]

sweep:
  noise_levels: [0.0, 0.005, 0.01, 0.05, 0.1]
  noise_param: "depolarizing_2q"
