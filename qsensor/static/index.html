<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Sensor Fault Classifier</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#15171c; --muted:#6b7280;
    --line:#e7e9ee; --accent:#2563eb; --ok:#15a34a; --bad:#dc2626;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex; justify-content:center; padding:48px 18px;
  }
  .app{width:100%; max-width:620px}
  header{margin-bottom:22px}
  .eyebrow{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.14em; color:var(--accent); margin-bottom:10px}
  h1{margin:0; font-size:30px; font-weight:680; letter-spacing:-.02em}
  .sub{margin:6px 0 0; color:var(--muted)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card + .card{margin-top:16px}
  .row{display:flex; align-items:center}
  .between{justify-content:space-between}
  .gap{gap:10px; margin-top:16px; flex-wrap:wrap}
  .lbl{font-weight:600; font-size:13px}
  .muted{color:var(--muted); font-weight:400}
  /* segmented model toggle */
  .seg{display:inline-flex; background:#f0f1f4; border-radius:9px; padding:3px}
  .seg button{border:0; background:transparent; color:var(--muted); cursor:pointer;
    font:600 12px system-ui; padding:6px 12px; border-radius:7px}
  .seg button.on{background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(16,24,40,.12)}
  /* sparkline */
  svg#spark{width:100%; height:96px; color:var(--accent); margin:14px 0 10px; display:block}
  svg#spark circle{fill:var(--accent)}
  textarea{width:100%; border:1px solid var(--line); border-radius:10px; resize:vertical;
    padding:10px 12px; font:13px/1.5 ui-monospace,Menlo,monospace; color:#374151; background:#fbfbfc}
  textarea:focus{outline:2px solid #dbe4ff; border-color:var(--accent)}
  button.ghost,button.primary{font:600 14px system-ui; padding:10px 16px; border-radius:10px; cursor:pointer}
  button.ghost{background:#fff; border:1px solid var(--line); color:var(--ink)}
  button.ghost:hover{background:#f7f8fa}
  button.primary{background:var(--accent); border:1px solid var(--accent); color:#fff; margin-left:auto}
  button.primary:hover{filter:brightness(1.05)}
  button:disabled{opacity:.55; cursor:default}
  /* result */
  .result{display:flex; flex-direction:column; gap:14px}
  .verdict{font-size:26px; font-weight:720; letter-spacing:-.01em}
  .result.normal{border-color:#bbf0cf} .result.normal .verdict{color:var(--ok)}
  .result.fault{border-color:#f6c9c9} .result.fault .verdict{color:var(--bad)}
  .result.err{border-color:#f6c9c9} .result.err .verdict{color:var(--bad); font-size:20px}
  .small{font-size:12px; color:var(--muted)}
  .bar{height:8px; background:#eef0f3; border-radius:99px; overflow:hidden; margin-top:6px}
  .bar>div{height:100%; width:0; border-radius:99px; background:var(--accent); transition:width .35s ease}
  .result.normal .bar>div{background:var(--ok)} .result.fault .bar>div{background:var(--bad)}
  .meta{font:12px ui-monospace,Menlo,monospace; color:var(--muted)}
  footer{margin-top:22px; text-align:center; color:var(--muted); font-size:12px}
  footer a{color:var(--accent); text-decoration:none}
</style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">QUANTUM SENSOR · 4-QUBIT VQC</div>
      <h1>Fault Classifier</h1>
      <p class="sub">Classify a bearing-vibration signal as healthy or faulty.</p>
    </header>

    <section class="card">
      <div class="row between">
        <span class="lbl">Sensor signal <span class="muted">· 8 samples</span></span>
        <div class="seg" id="modelSeg">
          <button data-model="vqc" class="on">VQC</button>
          <button data-model="classical">Classical</button>
        </div>
      </div>
      <svg id="spark" viewBox="0 0 600 120" preserveAspectRatio="none"></svg>
      <textarea id="signal" rows="2" spellcheck="false"></textarea>
      <div class="row gap">
        <button class="ghost" onclick="gen(false)">↻ Normal sample</button>
        <button class="ghost" onclick="gen(true)">↻ Fault sample</button>
        <button class="primary" id="run" onclick="classify()">Classify →</button>
      </div>
    </section>

    <section class="card result" id="result" hidden>
      <div class="verdict" id="verdict">—</div>
      <div>
        <div class="row between small"><span>confidence</span><span id="confval">—</span></div>
        <div class="bar"><div id="barfill"></div></div>
      </div>
      <div class="meta" id="meta"></div>
    </section>

    <footer>Running on a quantum statevector simulator · <a href="/docs">API docs</a></footer>
  </main>

<script>
  let model = "vqc";
  const sigEl = document.getElementById("signal");
  const resEl = document.getElementById("result");

  document.querySelectorAll("#modelSeg button").forEach(b => b.onclick = () => {
    model = b.dataset.model;
    document.querySelectorAll("#modelSeg button").forEach(x => x.classList.toggle("on", x === b));
  });

  const parseSignal = () => sigEl.value.split(/[,\s]+/).filter(Boolean).map(Number);

  function drawSpark(vals){
    const W=600,H=120,pad=12, n=vals.length;
    const min=Math.min(...vals), max=Math.max(...vals), rng=(max-min)||1;
    const xy = i => [pad + i*(W-2*pad)/(n-1), H-pad-((vals[i]-min)/rng)*(H-2*pad)];
    const line = vals.map((_,i)=>xy(i).map(v=>v.toFixed(1)).join(",")).join(" ");
    const dots = vals.map((_,i)=>{const[x,y]=xy(i);return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2"/>`}).join("");
    document.getElementById("spark").innerHTML =
      `<polyline points="${line}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>${dots}`;
  }

  async function gen(fault){
    try{
      const r = await fetch(`/sample?fault=${fault}&seed=${Math.floor(Math.random()*1e6)}`);
      const d = await r.json();
      sigEl.value = d.signal.map(x=>(+x).toFixed(3)).join(", ");
      drawSpark(d.signal);
      resEl.hidden = true;
    }catch(e){ showError("could not reach the API (is the server running?)"); }
  }

  async function classify(){
    const signal = parseSignal();
    const btn = document.getElementById("run");
    btn.disabled = true; btn.textContent = "Classifying…";
    try{
      const r = await fetch(`/predict?model=${model}`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({signal})
      });
      const d = await r.json();
      if(!r.ok) throw new Error(d.detail || "request failed");
      showResult(d);
    }catch(e){ showError(e.message); }
    finally{ btn.disabled = false; btn.textContent = "Classify →"; }
  }

  function showResult(d){
    resEl.hidden = false;
    resEl.className = "card result " + (d.label ? "fault" : "normal");
    document.getElementById("verdict").textContent = d.prediction.toUpperCase();
    document.getElementById("confval").textContent = (d.confidence*100).toFixed(1) + "%";
    document.getElementById("barfill").style.width = (d.confidence*100).toFixed(1) + "%";
    const z = d.z_expectation != null ? `  ·  ⟨Z⟩ = ${d.z_expectation}` : "";
    document.getElementById("meta").textContent = `model: ${d.model}${z}`;
  }

  function showError(msg){
    resEl.hidden = false; resEl.className = "card result err";
    document.getElementById("verdict").textContent = "Error";
    document.getElementById("confval").textContent = "—";
    document.getElementById("barfill").style.width = "0%";
    document.getElementById("meta").textContent = msg;
  }

  gen(false);   // load a starter signal
</script>
</body>
</html>
